name: Publicar versão
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run preparar-atualizacao
      - run: npm run gerar-release
      - name: Pacotes para instalação e edição manual de n8n
        run: |
          git archive --format=zip --output=dist/Sistema-Completo.zip HEAD
          cd 'Atualizações/Atualizacao atual/Colar no n8n'
          zip -r ../../../dist/Codes-n8n.zip .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "A release $tag já está publicada. Mantida sem alterações."
            exit 0
          fi
          gh release create "$tag" dist/atualizacao.json dist/Sistema-Completo.zip dist/Codes-n8n.zip --target "$GITHUB_SHA" --title "$tag" --notes-file NOTAS-DA-VERSAO.md
